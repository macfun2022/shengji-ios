name: Build signed IPA (手动签名)

# 只支持手动触发 —— 配置好 secrets 之前不会自动运行，也不会报错刷屏。
# 需要 5 个仓库 secret：TEAM_ID / BUILD_CERTIFICATE_BASE64 / P12_PASSWORD
#                      PROVISIONING_PROFILE_BASE64 / KEYCHAIN_PASSWORD
# 上传 TestFlight 另需 3 个：ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: '分发方式'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc      # 装到已注册 UDID 的设备，有效期 1 年
          - app-store   # TestFlight / 上架 App Store
          - development # 开发证书，装到已注册设备，1 年
      upload_testflight:
        description: '若为 app-store，导出后直接上传到 TestFlight'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查 secrets 是否齐备
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for v in TEAM_ID BUILD_CERTIFICATE_BASE64 P12_PASSWORD PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then echo "  ❌ 缺少 secret: $v"; missing=1; else echo "  ✅ $v"; fi
          done
          if [ "$missing" = "1" ]; then
            echo
            echo "请在仓库 Settings → Secrets and variables → Actions 里补齐以上 secret。"
            echo "生成方法见「苹果正式签名-操作手册.md」。"
            exit 1
          fi

      - name: 显示编译环境
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 安装签名证书与描述文件
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "=== 可用签名身份 ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PLIST"
          UUID=$(plutil -extract UUID raw -o - "$PLIST")
          PNAME=$(plutil -extract Name raw -o - "$PLIST")
          cp "$PROFILE_PATH" "$PP_DIR/$UUID.mobileprovision"

          echo "描述文件：$PNAME"
          echo "UUID    ：$UUID"
          echo "PROFILE_NAME=$PNAME" >> "$GITHUB_ENV"

      - name: Archive（自动注入递增构建号）
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ShengjiClient.xcodeproj \
            -scheme ShengjiClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ShengjiClient.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="${MARKETING_VERSION:-2.0.0}" \
            build

      - name: 导出 IPA（按所选分发方式重新签名）
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          case "${{ inputs.distribution }}" in
            ad-hoc)      METHOD="ad-hoc";            TAG="adhoc" ;;
            app-store)   METHOD="app-store-connect"; TAG="appstore" ;;
            development) METHOD="development";       TAG="dev" ;;
          esac
          echo "导出方式：$METHOD"

          PB=/usr/libexec/PlistBuddy
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' '<dict/>' '</plist>' > "$PLIST"

          $PB -c "Add :method string $METHOD"                          "$PLIST"
          $PB -c "Add :destination string export"                      "$PLIST"
          $PB -c "Add :teamID string $TEAM_ID"                         "$PLIST"
          $PB -c "Add :signingStyle string manual"                     "$PLIST"
          $PB -c "Add :stripSwiftSymbols bool true"                    "$PLIST"
          $PB -c "Add :compileBitcode bool false"                      "$PLIST"
          $PB -c "Add :manageAppVersionAndBuildNumber bool false"      "$PLIST"
          $PB -c "Add :provisioningProfiles dict"                      "$PLIST"
          $PB -c "Add :provisioningProfiles:com.shengji.app string $PROFILE_NAME" "$PLIST"
          plutil -p "$PLIST"

          rm -rf dist && mkdir -p dist
          xcodebuild -exportArchive \
            -archivePath build/ShengjiClient.xcarchive \
            -exportPath dist \
            -exportOptionsPlist "$PLIST" \
            -allowProvisioningUpdates

          IPA=$(find dist -name '*.ipa' | head -1)
          mv "$IPA" "dist/Shengji-$TAG.ipa"
          ls -lh dist/
          shasum -a 256 "dist/Shengji-$TAG.ipa"

      - name: 校验签名
        run: |
          set -euo pipefail
          rm -rf /tmp/sigchk && mkdir -p /tmp/sigchk
          unzip -q dist/Shengji-*.ipa -d /tmp/sigchk
          APP=$(find /tmp/sigchk/Payload -maxdepth 1 -name '*.app' | head -1)

          echo "=== 签名主体 ==="
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Identifier|TeamIdentifier|Authority|Expires' || true

          echo
          echo "=== 描述文件 ==="
          security cms -D -i "$APP/embedded.mobileprovision" > /tmp/sigchk/p.plist
          echo -n "名称  ："; plutil -extract Name raw -o - /tmp/sigchk/p.plist
          echo -n "到期  ："; plutil -extract ExpirationDate raw -o - /tmp/sigchk/p.plist
          plutil -extract ProvisionsAllDevices raw -o - /tmp/sigchk/p.plist 2>/dev/null || echo "类型  ：限定设备"

          echo
          echo "=== 深层校验 ==="
          codesign --verify --deep --strict --verbose=2 "$APP" && echo "✅ 签名校验通过"

          echo
          echo "=== www 资源 ==="
          ls -la "$APP/www" || { echo "❌ 缺少 www 目录"; exit 1; }

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: shengji-signed-ipa
          path: dist/*.ipa
          if-no-files-found: error

      - name: 上传到 TestFlight
        if: ${{ inputs.upload_testflight && inputs.distribution == 'app-store' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "❌ 缺少 ASC_KEY_ID / ASC_ISSUER_ID，无法上传"; exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          echo -n "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > "$KEY_PATH"

          PB=/usr/libexec/PlistBuddy
          PLIST="$RUNNER_TEMP/UploadOptions.plist"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' '<dict/>' '</plist>' > "$PLIST"

          $PB -c "Add :method string app-store-connect"    "$PLIST"
          $PB -c "Add :destination string upload"          "$PLIST"
          $PB -c "Add :teamID string $TEAM_ID"             "$PLIST"
          $PB -c "Add :signingStyle string manual"         "$PLIST"
          $PB -c "Add :provisioningProfiles dict"          "$PLIST"
          $PB -c "Add :provisioningProfiles:com.shengji.app string $PROFILE_NAME" "$PLIST"

          xcodebuild -exportArchive \
            -archivePath build/ShengjiClient.xcarchive \
            -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "✅ 已上传，去 App Store Connect → TestFlight 等待处理（15–30 分钟）"
